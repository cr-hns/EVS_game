name: Build EcoMayor

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.50.0'

defaults:
  run:
    working-directory: eco_mayor

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/EcoMayor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EcoMayor-android
          path: eco_mayor/build/EcoMayor.apk

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      # A one-off hang here once ran for 30+ minutes; fail fast and verbosely instead.
      - run: flutter pub get -v
        timeout-minutes: 10
      - run: flutter build windows --release
        timeout-minutes: 20
      # Bundle the Visual C++ runtime so the .exe runs on a fresh Windows 10 PC
      # without the user installing the VC++ Redistributable.
      - name: Bundle VC++ runtime
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" $out
          }
          Get-ChildItem $out
      - uses: actions/upload-artifact@v4
        with:
          name: EcoMayor-windows
          path: eco_mayor/build/windows/x64/runner/Release/
